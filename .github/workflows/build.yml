name: Build, Security Gate & Package Production dist.zip

# WHY THIS WORKFLOW HAS A PULL-REQUEST TRIGGER
#   Pushing to main used to be the first time anything was verified: the only
#   checks were "does dist.zip build" and the separate PHP suite. A dependency
#   advisory or a PHP file with a syntax error could therefore reach the
#   release artifact unnoticed. The `security`, `tests` and `playwright-smoke`
#   jobs below gate the packaging job, and they run on every pull request.

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------------------
  # 1. Dependency advisories + PHP syntax. Fails on high/critical production
  #    advisories and on ANY PHP parse error.
  # ---------------------------------------------------------------------------
  security:
    name: Security gate (npm audit, composer audit, php -l)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # The PHP-CS-Fixer step diffs against the PR base branch.
          fetch-depth: 0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup PHP 8.1 + Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: gd, mbstring, intl
          ini-values: memory_limit=512M
          tools: composer

      # npm ci is strict on purpose: a lockfile that drifted from package.json
      # is exactly what makes an audit meaningless.
      - name: Install frontend dependencies (strict lockfile)
        run: npm ci

      - name: npm audit — production dependencies (fail on high/critical)
        run: npm audit --omit=dev --audit-level=high

      # Build-time/dev advisories stay visible without blocking every PR:
      # a vulnerable build tool is still worth reading about, but it does not
      # ship to cPanel (there is no Node process on production).
      - name: npm audit — full tree (advisory only)
        continue-on-error: true
        run: npm audit --audit-level=high

      - name: Install PHP dependencies
        run: |
          if [ -f composer.lock ]; then
            composer install --no-interaction --prefer-dist --no-progress
          else
            # No committed composer.lock yet (see CI notes in
            # docs/PAYMENT_WEBHOOK_IDEMPOTENCY_AND_CI.md), so resolve it here and
            # audit what production would actually install.
            composer update --no-interaction --prefer-dist --no-progress
          fi

      - name: composer audit — production packages
        run: composer audit --no-dev

      - name: PHP syntax check — php -l on every API file
        run: |
          set -o pipefail
          find api -name '*.php' -not -path '*/vendor/*' -print0 \
            | xargs -0 -n1 -P4 php -l \
            | tee /tmp/php-lint.log
          echo "Linted $(grep -c 'No syntax errors detected' /tmp/php-lint.log) PHP file(s)."

      - name: PHPStan on the payment modules (advisory)
        continue-on-error: true
        run: |
          curl -sSL -o /tmp/phpstan.phar https://github.com/phpstan/phpstan/releases/latest/download/phpstan.phar
          php /tmp/phpstan.phar analyse --no-progress --error-format=github \
            --level=0 -c .github/phpstan.neon api/payments.php api/payment_webhook.php

      - name: PHP-CS-Fixer dry run on changed PHP files (advisory)
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: |
          CHANGED=$(git diff --name-only --diff-filter=ACMR origin/${{ github.base_ref }}...HEAD -- 'api/*.php' 'api/**/*.php' || true)
          if [ -z "$CHANGED" ]; then echo "No changed PHP files."; exit 0; fi
          curl -sSL -o /tmp/php-cs-fixer.phar https://github.com/PHP-CS-Fixer/PHP-CS-Fixer/releases/latest/download/php-cs-fixer.phar
          echo "$CHANGED" | tr '\n' ' ' > /tmp/changed-php.txt
          php /tmp/php-cs-fixer.phar fix --dry-run --diff --using-cache=no $(cat /tmp/changed-php.txt)

  # ---------------------------------------------------------------------------
  # 2. Node regression suite (includes the lockfile-drift check, the CI-gate
  #    contract and the checkout idempotency contract).
  #
  #    This used to be advisory because it was red on main: the orphaned
  #    src/components/common/LiveChatWidget.tsx had been replaced by the AI
  #    astrologer chat but was still in the tree, and the access test asserted
  #    its removal. The component is gone, so the suite is a real gate again.
  # ---------------------------------------------------------------------------
  tests:
    name: Node test suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Run the Node suites
        run: npm test

  # ---------------------------------------------------------------------------
  # 3. Browser smoke test — the customer's first click, on desktop and mobile.
  # ---------------------------------------------------------------------------
  playwright-smoke:
    name: Playwright smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Smoke test the homepage (desktop + mobile)
        run: |
          set +e
          npx playwright test tests/browser/homepage-navigation.spec.ts 2>&1 | tee /tmp/playwright-smoke.log
          STATUS=${PIPESTATUS[0]}
          if [ "$STATUS" -ne 0 ]; then
            # Job logs sit behind a storage redirect; annotations are readable
            # straight from the commit/PR page, so the first failing assertions
            # are re-emitted as error annotations before the step gives up.
            grep -nE "Error|expect|Timed out|Received|Expected|✘|failed" /tmp/playwright-smoke.log \
              | head -25 | while IFS= read -r line; do
                  echo "::error title=Playwright smoke failure::${line}"
                done
            exit "$STATUS"
          fi

      # White-screen gate for code splitting (audit S1): run the route smoke
      # against the REAL built output (vite preview serving dist/), the same
      # asset layout that ships to cPanel. Every route must render content,
      # every lazy chunk must load, no static asset may 404.
      - name: Build production output for the preview smoke
        run: npm run build

      # Built-output contract against the real dist/ (the `tests` job has no
      # build, so its built-output section skips): deploy shape AND the
      # __VITE_PRELOAD__ marker scan across raw files + decompressed .br/.gz
      # siblings — the exact bytes cPanel's .htaccess negotiates to production.
      - name: Built-output contract (dist shape + no free __VITE_PRELOAD__)
        run: npx tsx tests/dist-shape.test.ts

      # Definitive deployed-vs-local forensics (advisory: production lags PR
      # builds by design). CI runners have internet; the sandbox does not.
      # Prints size+sha256 of the local index chunk, of its decompressed .br
      # sibling, and of what https://astrosivam.com actually serves — and
      # warns loudly if the deployed body still carries a free
      # __VITE_PRELOAD__ placeholder (the 2026-10-13 outage signature).
      - name: Production forensics — deployed chunk vs local build (advisory)
        continue-on-error: true
        run: |
          set -u
          INDEX_JS=$(ls dist/assets/index-*.js | head -1)
          BASE=$(basename "$INDEX_JS")
          sha() { sha256sum "$1" | cut -d' ' -f1; }
          size() { stat -c%s "$1"; }
          echo "local raw .js : $BASE size=$(size "$INDEX_JS") sha256=$(sha "$INDEX_JS")"
          echo "local raw marker count: $(grep -ao '__VITE_PRELOAD__' "$INDEX_JS" | wc -l | tr -d ' ')"
          if [ -f "$INDEX_JS.br" ]; then
            node -e "const z=require('zlib'),fs=require('fs');fs.writeFileSync('/tmp/local-index.br.js',z.brotliDecompressSync(fs.readFileSync(process.argv[1])))" "$INDEX_JS.br"
            echo "local .br decompressed: size=$(size /tmp/local-index.br.js) sha256=$(sha /tmp/local-index.br.js)"
            echo "local .br marker count: $(grep -ao '__VITE_PRELOAD__' /tmp/local-index.br.js | wc -l | tr -d ' ')"
          fi
          # What the world gets with a Brotli-capable browser (production
          # .htaccess internally rewrites .js → .js.br on this header).
          HTTP=$(curl -sS -D /tmp/prod-br.headers -o /tmp/prod-br.body -H 'Accept-Encoding: br' -w '%{http_code}' "https://astrosivam.com/assets/$BASE" || echo "curl-failed")
          echo "production HTTP (Accept-Encoding: br): $HTTP"
          if [ "$HTTP" = "200" ]; then
            if grep -qi '^content-encoding: br' /tmp/prod-br.headers; then
              node -e "const z=require('zlib'),fs=require('fs');fs.writeFileSync('/tmp/prod-index.js',z.brotliDecompressSync(fs.readFileSync('/tmp/prod-br.body')))" || cp /tmp/prod-br.body /tmp/prod-index.js
            else
              cp /tmp/prod-br.body /tmp/prod-index.js
            fi
            echo "production body: size=$(size /tmp/prod-index.js) sha256=$(sha /tmp/prod-index.js)"
            PROD_MARKERS=$(grep -ao '__VITE_PRELOAD__' /tmp/prod-index.js | wc -l | tr -d ' ')
            echo "production marker count: $PROD_MARKERS"
            if [ "$PROD_MARKERS" != "0" ]; then
              echo "::warning title=Production serves a free __VITE_PRELOAD__::https://astrosivam.com/assets/$BASE still contains $PROD_MARKERS unreplaced placeholder(s) — every lazy route is broken for Brotli clients. Redeploy the fixed dist.zip and purge the Cloudflare cache."
            fi
            if cmp -s /tmp/prod-index.js "$INDEX_JS"; then
              echo "production body is byte-identical to this build's raw $BASE"
            else
              echo "::warning title=Deployed chunk differs from this build::$BASE on production is not byte-identical to the local build (expected before deploy; after deploying this build it means stale cache)."
            fi
          else
            echo "Not deployed yet or unreachable (HTTP $HTTP) — expected for PR builds and during rollback."
          fi
          # One-off incident forensics (2026-10-13 outage): while production
          # still runs the broken deploy, verify what Brotli-capable browsers
          # actually receive for the poisoned chunk. An identity fetch would
          # lie — Apache only rewrites to the .br sibling on the br header,
          # and the raw file was always clean.
          OLD_NAME=index-CvPoQHlu.js
          OLD_HTTP=$(curl -sS -D /tmp/inc-br.headers -o /tmp/inc-br.body -H 'Accept-Encoding: br' -w '%{http_code}' "https://astrosivam.com/assets/$OLD_NAME" || echo "curl-failed")
          echo "incident chunk $OLD_NAME (Accept-Encoding: br): HTTP $OLD_HTTP"
          if [ "$OLD_HTTP" = "200" ]; then
            if grep -qi '^content-encoding: br' /tmp/inc-br.headers; then
              node -e "const z=require('zlib'),fs=require('fs');fs.writeFileSync('/tmp/inc-index.js',z.brotliDecompressSync(fs.readFileSync('/tmp/inc-br.body')))" || cp /tmp/inc-br.body /tmp/inc-index.js
            else
              cp /tmp/inc-br.body /tmp/inc-index.js
            fi
            INC_MARKERS=$(grep -ao '__VITE_PRELOAD__' /tmp/inc-index.js | wc -l | tr -d ' ')
            echo "incident chunk body: size=$(size /tmp/inc-index.js) sha256=$(sha /tmp/inc-index.js) marker count: $INC_MARKERS"
            if [ "$INC_MARKERS" != "0" ]; then
              echo "::warning title=Production still serves the poisoned incident chunk::$OLD_NAME carries $INC_MARKERS free __VITE_PRELOAD__ placeholder(s) for Brotli clients — every lazy route is broken until the fixed dist.zip is redeployed and Cloudflare is purged."
            fi
          else
            echo "incident chunk $OLD_NAME is gone (HTTP $OLD_HTTP) — rolled back or already redeployed."
          fi

      - name: Route smoke against the production preview (anti white-screen)
        run: |
          set +e
          npx playwright test --config playwright.preview.config.ts 2>&1 | tee /tmp/playwright-preview.log
          STATUS=${PIPESTATUS[0]}
          if [ "$STATUS" -ne 0 ]; then
            grep -nE "Error|expect|Timed out|Received|Expected|✘|failed" /tmp/playwright-preview.log \
              | head -25 | while IFS= read -r line; do
                  echo "::error title=Preview route smoke failure::${line}"
                done
            exit "$STATUS"
          fi
          # Proof of execution: the spec appends its summary (and the
          # ROUTE-SMOKE-SUMMARY-OK marker) to $GITHUB_STEP_SUMMARY only when
          # it ran to completion. Job/step status APIs have been seen reporting
          # success while steps sat pending — this greps the artifact instead.
          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            if grep -q 'ROUTE-SMOKE-SUMMARY-OK' "$GITHUB_STEP_SUMMARY"; then
              echo "::notice title=Preview route smoke executed::spec completed; summary written to the run summary."
              grep -A8 'Route lazy-loading smoke' "$GITHUB_STEP_SUMMARY" | head -12
            else
              echo "::error title=Preview route smoke did not execute::Playwright exited 0 but the spec never wrote its ROUTE-SMOKE-SUMMARY-OK marker — treat this run as invalid."
              exit 1
            fi
          fi

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-smoke-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # 4. Package the release. Only runs when every gate above is green — the
  #    dependency/PHP audits, the Node contract suite and the browser smoke test.
  # ---------------------------------------------------------------------------
  build:
    name: Build production dist.zip
    needs: [ security, tests, playwright-smoke ]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20 (frontend build tools only)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Setup PHP 8.1 + Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: composer
          ini-values: memory_limit=512M

      - name: Install PHP dependencies
        run: |
          if [ -f composer.json ]; then
            if [ -f composer.lock ]; then
              composer install --no-dev --optimize-autoloader || echo "Composer install completed with warnings"
            else
              composer update --no-dev --optimize-autoloader || echo "Composer update completed with warnings"
            fi
          fi

      # Node.js runs only in CI to compile the static frontend; BigRock receives no Node server.
      - name: Install frontend build dependencies
        run: |
          npm ci || npm install

      - name: Build production app & generate dist.zip with api/
        run: |
          npm run build:zip
          ls -lh dist.zip dist/

      # The release artifact gets its own marker scan (this job rebuilds
      # independently of playwright-smoke): no shipped .js — raw or inside its
      # .br/.gz siblings — may contain a free __VITE_PRELOAD__ placeholder.
      - name: Built-output contract on the release build (dist shape + marker scan)
        run: npx tsx tests/dist-shape.test.ts

      - name: Verify dist.zip content
        run: |
          python3 - <<'PY'
          import zipfile
          with zipfile.ZipFile('dist.zip') as archive:
              names = archive.namelist()
          assert 'index.html' in names, 'Missing index.html'
          assert any(name.startswith('api/') for name in names), 'Missing PHP api/ folder'
          # Deploy shape contract (audit S1): the cPanel root folder list must
          # stay exactly this set — code splitting stays inside assets/, and
          # prerendered route HTML stays inside pages/. Keep in sync with
          # scripts/create_dist_zip.py.
          expected_dirs = {'api', 'assets', 'audio', 'docs', 'knowledge', 'pages', 'scripts', 'src', 'video-scenes'}
          top_dirs = {name.split('/', 1)[0] for name in names if '/' in name}
          assert top_dirs == expected_dirs, f'Root folders changed: {sorted(top_dirs)}'
          for kb in (
              'knowledge/ai-astrologer/rules/guided-questions.json',
              'knowledge/ai-astrologer/rules/life-areas.json',
              'knowledge/ai-astrologer/rules/guardrails.json',
              'knowledge/ai-astrologer/rules/remedies.json',
              'knowledge/ai-astrologer/rules/report-sections.json',
              'knowledge/ai-astrologer/sources.json',
              'api/knowledge/ai-astrologer/rules/guided-questions.json',
              # The webhook idempotency migration must ship with the API.
              'api/migrations/008_payment_idempotency.sql',
              # Ops surface: the admin health endpoint and the backup/rotation
              # scripts. A release without them cannot be monitored.
              'api/admin/health.php',
              'scripts/backup/astro_site_backup.sh',
              'scripts/ops/rotate_php_logs.sh',
          ):
              assert kb in names, f'Missing {kb} in dist.zip'
          assert not any(name.endswith(('.cjs', '.map')) for name in names), 'Server bundle or source map must not be deployed'
          # Every lazy route chunk must be in the zip: a missing chunk is the
          # white-screen failure mode of code splitting (audit S1).
          for page in ('AdminPortal', 'CustomerDashboard', 'BirthJathagamPage',
                       'MarriageCompatibilityPage', 'BabyNamingPage', 'MuhurthamPage'):
              assert any(name.startswith(f'assets/{page}-') and name.endswith('.js') for name in names), \
                  f'Missing lazy route chunk for {page} in dist.zip'
          print(f'Static/PHP dist.zip verified successfully! Total files: {len(names)}')
          PY

      - name: Upload dist.zip as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: astrosivam-dist
          path: dist.zip
          retention-days: 30
          overwrite: true

      - name: Publish / Update Latest Release Asset
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: latest
          name: ASTRO SIVAM Production Build (Latest)
          body: |
            Automated production build including:
            - Full optimized React frontend (`dist/`)
            - Complete cPanel PHP backend (`/api/`) with Vedic astrology engine
            - BigRock cPanel Deployment Guide (`docs/BIGROCK_CPANEL_DEPLOYMENT_GUIDE.md`)
            
            **Download `dist.zip` below and upload to your cPanel `public_html/`.**
          files: |
            dist.zip
          draft: false
          prerelease: false
