# ============================================================================
# ASTRO SIVAM - independent weekly production monitor
# ============================================================================
#
# WHY A GITHUB ACTIONS CRON AND NOT ONLY UPTIME ROBOT
# --------------------------------------------------
# The site reports its own health through /api/admin/health.php, but a site that
# is *down* cannot report that it is down, and the Let's Encrypt certificate
# expiring does not look like an outage until the day it does. This workflow runs
# from GitHub's network, needs no credentials, and fails loudly (GitHub emails
# the repository owner on a scheduled-run failure) when:
#
#   * the API edge is unreachable or slow,
#   * the TLS certificate is close to expiry,
#   * the deployed `dist.zip` build is missing the payment idempotency
#     migration (i.e. the hardening was never deployed),
#   * the uptime monitor (if UPTIME_ROBOT_HEARTBEAT_URL is set) has not seen a
#     clean check either.
#
# SETUP (once): set the repository variable PRODUCTION_URL (Settings >
# Secrets and variables > Actions > Variables), e.g. https://astrosivam.com.
# Without it the workflow still runs and reports that monitoring is UNARMED -
# an unmonitored production site is exactly the kind of thing that must not fail
# silently.
#
# The in-app counterpart (DB, schema, providers, capture status, webhook ledger,
# storage, backups, logging, runtime limits) is GET /api/admin/health.php; see
# docs/HEALTH_MONITORING_AND_BACKUP_VERIFICATION.md.
# ============================================================================
name: Production monitoring

# Supply-chain pins: every third-party action in this file is pinned to a full
# commit SHA (the tag is kept as a trailing comment for readability). Tags are
# moving refs — a compromised or re-pushed tag could otherwise ship arbitrary
# code into CI. Refresh a pin with:
#   curl -s https://api.github.com/repos/<owner>/<repo>/commits/<tag>

on:
  schedule:
    # Weekly, Monday 06:15 UTC. Tuesdays catch the host's Sunday
    # backup window before a human looks at it again.
    - cron: '15 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-monitoring
  cancel-in-progress: false

jobs:
  uptime:
    name: Uptime + TLS expiry + deployed build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Verify PRODUCTION_URL is configured
        env:
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
        run: |
          if [ -z "${PRODUCTION_URL}" ]; then
            echo "::error title=Monitoring is unarmed::Set the repository variable PRODUCTION_URL (Settings > Secrets and variables > Actions > Variables) to the production origin, e.g. https://astrosivam.com."
            exit 1
          fi

      - name: Uptime + latency (3 attempts)
        env:
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
          SLOW_SECONDS: '5'
        run: |
          set -uo pipefail
          URL="${PRODUCTION_URL%/}/"
          for attempt in 1 2 3; do
            BODY=$(mktemp)
            CODE=$(curl -sS -o "$BODY" -w '%{http_code}' --max-time 20 --location "$URL" || echo 000)
            ELAPSED=$(curl -sS -o /dev/null -w '%{time_total}' --max-time 20 --location "$URL" || echo 0)
            echo "attempt ${attempt}: HTTP ${CODE} in ${ELAPSED}s"
            if [ "$CODE" = "200" ]; then
              awk -v t="$ELAPSED" -v limit="$SLOW_SECONDS" 'BEGIN { if (t+0 > limit+0) { printf "::warning title=Slow production response::%s took %ss\n", "homepage", t } }'
              exit 0
            fi
            sleep 20
          done
          echo "::error title=Production is unreachable::${URL} did not answer HTTP 200 in 3 attempts."
          exit 1

      - name: TLS certificate expiry
        env:
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
          MIN_DAYS: '21'
        run: |
          set -uo pipefail
          HOST=$(printf '%s' "$PRODUCTION_URL" | sed -E 's#^https?://##; s#/.*$##; s#:.*$##')
          if [ -z "$HOST" ]; then
            echo "::error title=TLS check::could not derive a hostname from PRODUCTION_URL"
            exit 1
          fi
          EXPIRY=$(echo | openssl s_client -servername "$HOST" -connect "${HOST}:443" 2>/dev/null | openssl x509 -noout -enddate 2>/dev/null | cut -d= -f2)
          if [ -z "$EXPIRY" ]; then
            echo "::error title=TLS check failed::could not read the certificate for ${HOST}:443"
            exit 1
          fi
          EXPIRY_EPOCH=$(date -d "$EXPIRY" +%s)
          NOW_EPOCH=$(date +%s)
          DAYS=$(( (EXPIRY_EPOCH - NOW_EPOCH) / 86400 ))
          echo "certificate for ${HOST} expires ${EXPIRY} (${DAYS} days)"
          if [ "$DAYS" -lt 0 ]; then
            echo "::error title=Certificate expired::${HOST} certificate expired on ${EXPIRY}."
            exit 1
          fi
          if [ "$DAYS" -lt "$MIN_DAYS" ]; then
            echo "::error title=Certificate expiring soon::${HOST} certificate expires in ${DAYS} days (${EXPIRY}). Renew it - cPanel AutoSSL or the Let's Encrypt client - before it lapses."
            exit 1
          fi

      - name: Edge is in front and is not caching the API
        env:
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
        run: |
          set -uo pipefail
          URL="${PRODUCTION_URL%/}"

          # 1. Cloudflare must actually be in front. The whole point of the CDN
          #    item is edge caching + DDoS posture, and a silent proxy bypass
          #    (DNS record set to "DNS only") would leave the origin exposed with
          #    nobody noticing.
          HEADERS=$(curl -sSI --max-time 20 --location "$URL/" || true)
          if ! printf '%s' "$HEADERS" | grep -qi '^cf-ray:'; then
            echo "::error title=Cloudflare is not in front::${URL} did not answer with a cf-ray header. Set the DNS record to Proxied (orange cloud) and confirm SSL/TLS mode is Full (strict)."
            exit 1
          fi
          echo "edge: $(printf '%s' "$HEADERS" | grep -i '^cf-ray:' | tr -d '\r')"

          # 2. HSTS must survive the proxy hop (Cloudflare preserves an origin
          #    HSTS header, but a rewrite/pagerule can drop it).
          if ! printf '%s' "$HEADERS" | grep -qi '^strict-transport-security:'; then
            echo "::error title=HSTS missing behind the CDN::the homepage no longer sends Strict-Transport-Security."
            exit 1
          fi

          # 3. THE DANGEROUS ONE: a cached API response is a cross-customer data
          #    leak. /api/ must never be served from the edge cache, and the
          #    origin must say no-store for anything session-scoped.
          # GET, not HEAD: this route answers a readiness payload on GET, and
          # HEAD would be an odd 405 to explain in the run log.
          API_HEADERS=$(curl -sS -o /dev/null -D - --max-time 20 "$URL/api/payment/webhook/health" || true)
          CF_STATUS=$(printf '%s' "$API_HEADERS" | grep -i '^cf-cache-status:' | tr -d '\r' | awk '{print toupper($2)}')
          CACHE_CONTROL=$(printf '%s' "$API_HEADERS" | grep -i '^cache-control:' | tr -d '\r')
          echo "api cf-cache-status: ${CF_STATUS:-none} | ${CACHE_CONTROL:-no cache-control}"
          if [ "$CF_STATUS" = "HIT" ]; then
            echo "::error title=API responses are being edge-cached::/api/payment/webhook/health answered cf-cache-status: HIT. Add a Cache Rule bypassing /api/* before a session-scoped endpoint gets cached."
            exit 1
          fi
          if ! printf '%s' "$API_HEADERS" | grep -qi '^cache-control:.*no-store'; then
            echo "::error title=API responses are cacheable::the origin did not send Cache-Control: no-store for an API response."
            exit 1
          fi

          # 4. Compression at the edge (Brotli) - informational, never fatal:
          #    the settings toggle can change without breaking anything.
          ENC=$(curl -sS -o /dev/null -D - -H 'Accept-Encoding: br,gzip' --max-time 20 "$URL/" \
            | grep -i '^content-encoding:\|^cf-brotli' | tr -d '\r' || true)
          echo "compression: ${ENC:-standard}"

      - name: Deployed build actually contains the payment hardening
        env:
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
        run: |
          set -uo pipefail
          # The hardening ships in the same release as this migration. If the
          # deployed asset has no PAYMENT_IDEMPOTENCY marker we are auditing a
          # tree that production is not running.
          ZIP_URL="${PRODUCTION_URL%/}/dist.zip"
          OUT=$(mktemp)
          CODE=$(curl -sS -o "$OUT" -w '%{http_code}' --max-time 60 "$ZIP_URL" || echo 000)
          if [ "$CODE" != "200" ]; then
            echo "::warning title=Could not read the deployed build::${ZIP_URL} answered HTTP ${CODE}; skipping the build-content check."
            exit 0
          fi
          if ! unzip -l "$OUT" | grep -q '008_payment_idempotency'; then
            echo "::error title=Payment hardening not deployed::The deployed dist.zip has no api/migrations/008_payment_idempotency.sql - production is running a build from before the payment idempotency work."
            exit 1
          fi
          echo "deployed build contains the payment idempotency migration"

      - name: UptimeRobot heartbeat (optional)
        env:
          HEARTBEAT_URL: ${{ vars.UPTIME_ROBOT_HEARTBEAT_URL }}
        run: |
          set -uo pipefail
          if [ -z "${HEARTBEAT_URL}" ]; then
            echo "No UPTIME_ROBOT_HEARTBEAT_URL variable set - skipping the external monitor heartbeat."
            echo "::notice title=Optional monitor::Set UPTIME_ROBOT_HEARTBEAT_URL to have UptimeRobot/Uptime-Kuma alert on lapses as well as outages."
            exit 0
          fi
          CODE=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "$HEARTBEAT_URL" || echo 000)
          if [ "$CODE" != "200" ]; then
            echo "::error title=Heartbeat check failed::the uptime monitor at UPTIME_ROBOT_HEARTBEAT_URL answered HTTP ${CODE}."
            exit 1
          fi
          echo "uptime monitor heartbeat OK"
