# ONE-OFF generator: produces composer.lock on a real PHP + Composer toolchain
# and commits it back to the branch that triggered this run (artifact download
# is not reachable from the audit sandbox; runners can always reach github.com).
# Delete this workflow after the lockfile lands — CI then validates it via
# tests.yml / build.yml on the pull request.
name: Generate composer.lock (one-off)

on:
  workflow_dispatch:
  push:
    branches:
      - 'arena/**'

permissions:
  contents: write

concurrency:
  group: gen-composer-lock-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP 8.1 + Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: gd, mbstring, intl
          ini-values: memory_limit=512M
          tools: composer

      - name: Resolve dependencies (writes composer.lock)
        run: composer update --no-interaction --prefer-dist --no-progress

      - name: Validate lockfile
        run: |
          composer validate --no-check-publish
          composer install --no-interaction --dry-run
          echo '--- resolved packages ---'
          php -r '$l = json_decode(file_get_contents("composer.lock"), true); foreach ($l["packages"] as $p) { echo $p["name"], " ", $p["version"], PHP_EOL; }'

      - name: Commit composer.lock back to the branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add composer.lock
          if git diff --cached --quiet; then
            echo "composer.lock unchanged; nothing to commit."
            exit 0
          fi
          # [skip ci] prevents this machine commit from re-triggering this workflow.
          git commit -m "Add composer.lock (generated by CI) [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
