# ONE-OFF generator: produces composer.lock on a real PHP + Composer toolchain
# and uploads it as an artifact. Used once to pin mPDF/pdfparser resolution;
# delete this workflow after the lockfile is committed (CI then validates it
# via tests.yml / build.yml).
name: Generate composer.lock (one-off)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP 8.1 + Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: gd, mbstring, intl
          ini-values: memory_limit=512M
          tools: composer

      - name: Resolve dependencies (writes composer.lock)
        run: composer update --no-interaction --prefer-dist --no-progress

      - name: Validate lockfile
        run: |
          composer validate --no-check-publish
          composer install --no-interaction --dry-run
          echo '--- resolved packages ---'
          php -r '$l = json_decode(file_get_contents("composer.lock"), true); foreach ($l["packages"] as $p) { echo $p["name"], " ", $p["version"], PHP_EOL; }'

      - name: Upload composer.lock
        uses: actions/upload-artifact@v4
        with:
          name: composer-lock
          path: composer.lock
          retention-days: 7
