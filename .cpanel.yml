---
deployment:
  tasks:
    - export DEPLOYPATH=/home/$USER/public_html
    - /bin/mkdir -p $HOME/.astrosivam
    # Preserve live database credentials on subsequent Git deployments while still
    # installing config.php on a fresh host. The live file is archived OUTSIDE the
    # docroot (so it is never web-supplied by a stale upload); API security/
    # hardening changes must be re-applied deliberately (docs/AUTH_SECURITY_
    # HARDENING.md) because the archive is a snapshot, not the live source of truth.
    - /bin/find api -type f ! -path 'api/astrology/tmp/app_secret_key.txt' ! -path 'api/astrology/tmp/app_secret_key.txt.*' -exec sh -c 'for file do relative="${file#api/}"; target="$DEPLOYPATH/api/$relative"; if [ "$relative" = "config.php" ] && [ -f "$target" ]; then cp -p "$file" "$HOME/.astrosivam/config.php.live-$(date +%s)"; continue; fi; /bin/mkdir -p "$(dirname "$target")"; /bin/cp -f "$file" "$target"; done' sh {} +
    - /bin/mkdir -p $DEPLOYPATH/src/lib/muhurtham
    - /bin/cp -f src/lib/muhurtham/rules.json $DEPLOYPATH/src/lib/muhurtham/rules.json
    - /bin/find dist -type f ! -name '*.map' ! -name '*.cjs' -exec sh -c 'for file do target="$DEPLOYPATH/${file#dist/}"; /bin/mkdir -p "$(dirname "$target")"; /bin/cp -f "$file" "$target"; done' sh {} +
    - /bin/cp -f public/.htaccess $DEPLOYPATH/.htaccess
    # Remove stale pre-compressed siblings of the crawl-facing documents. The build no longer emits them (a crawl-facing document must be served as plain bytes), but a copy left over from an earlier deploy would still be negotiated and served as application/x-gzip with no Content-Encoding header - the 2026-10-17 "sitemap.xml 406" failure.
    - /bin/rm -f $DEPLOYPATH/sitemap.xml.gz $DEPLOYPATH/sitemap.xml.br $DEPLOYPATH/robots.txt.gz $DEPLOYPATH/robots.txt.br
    - /bin/find $DEPLOYPATH/api -type d -exec /bin/chmod 755 {} +
    - /bin/find $DEPLOYPATH/api -type f -exec /bin/chmod 644 {} +
    - /bin/chmod 640 $DEPLOYPATH/api/config.php 2>/dev/null || true
    - /bin/chmod 600 $DEPLOYPATH/api/astrology/tmp/app_secret_key.txt 2>/dev/null || true
    - /bin/chmod 644 $DEPLOYPATH/.htaccess
