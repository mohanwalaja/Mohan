    <!-- BOOT CRITICAL (mobile white-screen fix, 2026-10-14). Reported: opening
         astrosivam.com on a phone showed a WHITE screen for ~2 s. This document
         is the whole first paint, but its styles live in /assets/index-*.css (a
         render-blocking second request) and its pixels come from the React
         bundle — so until both arrive the browser paints its own white canvas.
         The inline style below paints the brand canvas and ASTRO SIVAM splash
         from the HTML alone: public prerenders use the light default loading
         surface, while non-prerendered admin startup stays dark. No extra
         request, image, or JavaScript is needed
         (the CSP allows inline styles but not inline scripts).

         src/services/bootSplash.ts removes it once a route has rendered, and it
         cannot trap a visitor when that JS never runs: <noscript> hides it, an
         8 s CSS animation fades it, and main.tsx / App.tsx / the ErrorBoundary
         each dismiss it on the JS paths.
         Full story + how to verify: docs/BOOT_SPLASH_MOBILE_WHITE_SCREEN.md
         Pinned by: tests/boot-splash-contract.test.ts
         It is inlined into all 18 prerendered documents — keep it small. -->
    <style id="boot-critical">
      /* Light canvas by default (user request) — dark only when explicitly chosen. */
      html,
      body {
        background-color: #fffaf2;
        color: #1a1233;
      }
      html {
        color-scheme: light;
      }
      body {
        margin: 0;
      }
      /* Splash — light Ivory surface by default. */
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 2147483646;
        display: flex;
        align-items: center;
        justify-content: center;
        background: radial-gradient(120% 90% at 50% 0%, #fffdf9 0%, #fffaf2 58%, #f7ecdc 100%);
        animation: boot-splash-escape 600ms ease 8s forwards;
      }
      #boot-splash .boot-ring {
        border-color: rgba(156, 76, 29, 0.18);
        border-top-color: #9c4c1d;
      }
      #boot-splash .boot-core {
        background: #9c4c1d;
        box-shadow: 0 0 18px 4px rgba(156, 76, 29, 0.24);
      }
      #boot-splash .boot-word { color: #6f391f; }
      #boot-splash .boot-sub { color: #6e6052; }
      #boot-splash .boot-lockup {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
        padding: 24px;
        text-align: center;
      }
      #boot-splash .boot-orb {
        position: relative;
        display: grid;
        place-items: center;
        width: 56px;
        height: 56px;
      }
      #boot-splash .boot-ring {
        position: absolute;
        inset: 0;
        border: 2px solid rgba(156, 76, 29, 0.18);
        border-top-color: #9c4c1d;
        border-radius: 50%;
        animation: boot-splash-spin 1.05s linear infinite;
      }
      #boot-splash .boot-core {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: #9c4c1d;
        box-shadow: 0 0 18px 4px rgba(156, 76, 29, 0.24);
      }
      #boot-splash .boot-word {
        margin: 0;
        font-family: Georgia, 'Times New Roman', serif;
        font-size: 1.05rem;
        font-weight: 600;
        letter-spacing: 0.32em;
        text-indent: 0.32em;
        color: #6f391f;
      }
      #boot-splash .boot-sub {
        margin: 0;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        font-size: 0.68rem;
        letter-spacing: 0.24em;
        text-transform: uppercase;
        color: #6e6052;
      }
      @keyframes boot-splash-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @keyframes boot-splash-escape {
        to {
          opacity: 0;
          visibility: hidden;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot-splash .boot-ring {
          animation: none;
        }
      }
      /* Added by src/services/bootSplash.ts once the app has rendered. */
      #boot-splash.boot-splash-hide {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
        transition: opacity 320ms ease, visibility 0s linear 320ms;
      }
    </style>
    <!-- Every prerendered route document injects its own <title>/<meta>/
         <link> tags here (scripts/prerender.mjs). The anchor sits after the
         boot-critical style on purpose: <meta charset> and the first paint
         styles must stay the first bytes of the head, and the route tags must
         not push them past the spec's 1024-byte encoding-declaration window. -->
