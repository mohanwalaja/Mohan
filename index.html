         The inline style below paints the brand's dark surface and the ASTRO

         JavaScript (the CSP allows inline styles but not inline scripts, so a

      html,

      #boot-splash {

        inset: 0;
        z-index: 2147483646;
        display: flex;
        align-items: center;
        justify-content: center;

      }
      @keyframes boot-splash-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @keyframes boot-splash-escape {
        to {
          opacity: 0;
          visibility: hidden;
        }
      }
      @media (prefers-reduced-motion: reduce) {

          animation: none;
        }
      }

      #boot-splash.boot-splash-hide {
