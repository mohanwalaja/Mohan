; ASTRO SIVAM - PHP runtime limits for the API folder (cPanel / LiteSpeed /
; PHP-FPM all read .user.ini per directory).
;
; WHY THESE VALUES MATTER
; -----------------------
; The admin panel renders reports and invoices in the browser at high
; resolution (~2 MB per report) and POSTs them to the API so the customer
; receives exactly what the admin previewed. With PHP's stock limits
; (post_max_size 8M / upload_max_filesize 2M / memory_limit 128M) a family
; bundle - or even one large report - is silently discarded by PHP: the request
; body arrives EMPTY, no error is raised, and the handler falls back to the
; low-quality server-side PDF renderer.
;
; The documents are now uploaded ONE per request (see admin/family_docs.php),
; but the limits below still need headroom for a single 2 MB PDF + base64
; overhead, and for the multi-PDF email build.
;
; NOTE: .user.ini is re-read every `user_ini.cache_ttl` seconds (300 by
; default), so allow up to 5 minutes after upload for the change to apply.
; Direct web access to this file is blocked by api/.htaccess.

memory_limit = 512M
post_max_size = 128M
upload_max_filesize = 64M
max_execution_time = 300
max_input_time = 300
max_input_vars = 5000
